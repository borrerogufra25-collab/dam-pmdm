<section>
    <h1>Episodios de Rick and Morty</h1>

    <button (click)="loadEpisodes()" [disabled]="loading()">
        {{ loading() ? 'Cargando...' : 'Cargar episodios' }}
    </button>

    @if (error()) {
    <p class="error">{{ error() }}</p>
    }

    <ul>
        @for (ep of episodeList(); track ep.id) {
        <app-episode-item-component [episode]="ep" />
        } @empty {
        <li>Aún no hay episodios cargados.</li>
        }
    </ul>
</section>
