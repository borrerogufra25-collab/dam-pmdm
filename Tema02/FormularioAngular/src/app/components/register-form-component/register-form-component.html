<form>

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" placeholder="Introduce tu nombre" [(ngModel)]="nombre">
    </div>

    <div class="mb-3">
        <label class="form-label">Apellidos</label>
        <input type="text" class="form-control" placeholder="Introduce tus apellidos" [(ngModel)]="apellidos">
    </div>

    <div class="mb-3">
        <label class="form-label">NIF</label>
        <input type="text" class="form-control" placeholder="12345678A" [(ngModel)]="nif">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="ejemplo@correo.com" [(ngModel)]="email">
    </div>

    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="tel" class="form-control" placeholder="600123456" [(ngModel)]="telefono">
    </div>

    <div class="mb-3">
        <label class="form-label d-block">Sexo</label>

        <div class="form-check">
            <input class="form-check-input" type="radio" value="Hombre" [(ngModel)]="sexo">
            <label class="form-check-label">
                Hombre
            </label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" value="Mujer" [(ngModel)]="sexo">
            <label class="form-check-label">
                Mujer
            </label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" value="Otro" [(ngModel)]="sexo">
            <label class="form-check-label">
                Otro
            </label>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">
            ¿Cómo conoció la página?
        </label>

        <select class="form-select" [(ngModel)]="comoConocio">

            <option value="" selected>Seleccione una opción</option>
            <option value="Google">Buscando en Google</option>
            <option value="Amigo">A través de un amigo</option>
            <option value="Profesor">Por mi profesor</option>

        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" placeholder="Introduce tu contraseña" [(ngModel)]="contrasenia">
    </div>

    <div class="mb-3">
        <label class="form-label">Confirmar contraseña</label>
        <input type="password" class="form-control" placeholder="Repite la contraseña"
            [(ngModel)]="confirmarContrasenia">
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" [(ngModel)]="aceptaTerminos">

        <label class="form-check-label">
            Acepto los términos y condiciones
        </label>
    </div>

    <button type="button" (click)="registrar()" class="theme-primary btn-solid btn-styled">
        Registrarse
    </button>

</form>
