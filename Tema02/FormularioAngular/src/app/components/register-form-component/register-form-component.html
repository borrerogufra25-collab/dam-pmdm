<h4 class="mb-3">Formulario</h4>

<form mb-3>

    <div class="mb-3">
        <label for="" class="form-label">Nombre</label>
        <input [ngClass]="nombre" type="text" class="form-control" name="" id="" placeholder="Introduce tu nombre" />
    </div>

    <div class="mb-3">
        <label for="" class="form-label">Apellido</label>
        <input type="text" class="form-control" name="" id="" aria-describedby=""
            placeholder="Introduce tus apellidos" />
    </div>

    <div class="mb-3">
        <label for="" class="form-label">DNI</label>
        <input type="text" class="form-control" name="" id="" aria-describedby="" placeholder="Introduce tu DNI" />
    </div>

    <div class="mb-3">
        <label for="" class="form-label">Correo</label>
        <input type="email" class="form-control" name="" id="" aria-describedby="emailHelpId"
            placeholder="abc@mail.com" />
    </div>

    <div class="mb-3">
        <label for="" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" name="" id="" aria-describedby="helpId"
            placeholder="Introduce tu número de teléfono " />
    </div>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="sexo" id="sexo" />
        <label class="form-check-label" for="sexo"> Hombre </label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="sexo" id="sexo" />
        <label class="form-check-label" for="sexo"> Mujer </label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="sexo" id="sexo" />
        <label class="form-check-label" for="sexo"> Otro </label>
    </div>

    <div class="mb-3">
        <label for="" class="form-label">¿Cómo nos conociste?</label>
        <select multiple class="form-select form-select-lg" name="" id="">
            <option selected>Elige una</option>
            <option value="1">Buscando en Google</option>
            <option value="2">A través de un amigo</option>
            <option value="3">Por mi profesor</option>
            <option value="4">Otro</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="" class="form-label">Contraseña<a href=""></a></label>
        <input type="password" class="form-control" name="" id="" placeholder="Introduce la contraseña" />
    </div>


</form>
