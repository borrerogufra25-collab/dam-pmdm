<form [formGroup]="formularioBlog" (ngSubmit)="onSubmit()" class="form-card">
    <h2 class="form-title">Nueva publicación</h2>

    <div class="mb-3">
        <label for="title" class="form-label">Título</label>
        <input id="title" type="text" class="form-control" formControlName="title" />
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea id="description" rows="3" class="form-control" formControlName="description"></textarea>
    </div>

    <div class="mb-3">
        <label for="category" class="form-label">Categoría</label>
        <select id="category" class="form-select" formControlName="category">
            <option value="" selected disabled>Elige una</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Diseño">Diseño</option>
            <option value="Programación">Programación</option>
            <option value="Novedades">Novedades</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="tags" class="form-label">Etiquetas</label>
        <input id="tags" type="text" class="form-control" formControlName="tags" />
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email del autor</label>
        <input id="email" type="email" class="form-control" formControlName="email" />
    </div>

    <fieldset class="mb-3">
        <legend class="col-form-label pt-0">Publicación</legend>
        <div class="form-check">
            <input class="form-check-input" type="radio" id="pubNow" [value]="true" formControlName="publishNow" />
            <label class="form-check-label" for="pubNow">Publicar ahora</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" id="pubLater" [value]="false" formControlName="publishNow" />
            <label class="form-check-label" for="pubLater">Programar fecha</label>
        </div>
    </fieldset>

    <div class="mb-3">
        <label for="publishDate" class="form-label">Fecha y hora</label>
        <input id="publishDate" type="datetime-local" class="form-control" formControlName="publishDate" />
    </div>

    <button type="submit" [disabled]="!formularioBlog.valid" class="btn btn-primary">Enviar</button>
</form>
