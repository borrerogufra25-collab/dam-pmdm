<!-- Titulo y rejilla de tarjetas con los Pokemon del catalogo. -->
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Pokémon</h2>
  </div>

  <!-- Cada Pokemon se muestra mediante su componente de tarjeta. -->
  <div class="row row-cols-1 row-cols-md-3 g-3">
    @for (item of pokemonList(); track item.name) {
    <app-pokemon-item-component class="col" [pokemon]="item"></app-pokemon-item-component>
    }
  </div>
</div>
