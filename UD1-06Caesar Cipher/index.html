<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link rel="stylesheet" href="estilo.css">
    <script defer src="script.js"></script>


</head>

<body>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Cifrado Cesar</h1>

        <div class="mb-4"> <label for="textoNormal" class="form-label"> Escribe el texto (<strong>Normal</strong>):
            </label>
            <textarea id="textoNormal" class="form-control" rows="10" placeholder="Escribe aquí..."></textarea>
        </div>

        <hr>

        <div class="mb-4"> <label for="textoCifrado" class="form-label"> Escribe el texto (<strong>Cifrado</strong>):
            </label>
            <textarea id="textoCifrado" class="form-control" rows="10" placeholder="Escribe aquí..."></textarea>
        </div>

    </div>

</body>

</html>
