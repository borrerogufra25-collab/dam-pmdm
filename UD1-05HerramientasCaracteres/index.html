<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link rel="stylesheet" href="estilo.css">
    <script defer src="script.js"></script>


</head>

<body>

    <div class="container mt-5">
        <h1 class="text-center mb-4"> Contador de texto </h1>

        <div class="mb-4"> <label for="texto" class="form-label"> Escribe el texto: </label>
            <textarea id="texto" class="form-control" rows="10" placeholder="Escribe aquí..."></textarea>
        </div>

        <div class="row text-center">

            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5>Caracteres</h5>
                        <p id="caracteres" class="contador"> 0 </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5>Palabras</h5>
                        <p id="palabras" class="contador"> 0 </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5>Sin espacios</h5>
                        <p id="sinEspacios" class="contador"> 0 </p>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5>Párrafos</h5>
                        <p id="parrafos" class="contador"> 0 </p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
