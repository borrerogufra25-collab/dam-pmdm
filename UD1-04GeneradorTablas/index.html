<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script defer src="index.js"></script>


</head>


<body>

    <h1 class="mb-4">Generador visual de tablas</h1>

    <div class="container mt-3">
        <table id="tabla" class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Prueba</th>
                    <th>Prueba</th>
                    <th>Prueba</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Prueba</td>
                    <td>Prueba</td>
                    <td>Prueba</td>
                    <td>
                        <button class='btn btn-danger btnEliminarFila'>Eliminar</button>
                    </td>
                </tr>
                <tr>
                    <td>Prueba</td>
                    <td>Prueba</td>
                    <td>Prueba</td>
                    <td>
                        <button class='btn btn-danger btnEliminarFila'>Eliminar</button>
                    </td>
                </tr>
                <tr>
                    <td>Prueba</td>
                    <td>Prueba</td>
                    <td>Prueba</td>
                    <td>
                        <button class='btn btn-danger btnEliminarFila'>Eliminar</button>
                    </td>
                </tr>

            </tbody>
        </table>

        <div class="mt-4">

            <button id="btnAgregarFila" class="btn btn-primary">
                Añadir fila
            </button>

            <button id="btnAgregarColumna" class="btn btn-success">
                Añadir columna
            </button>

            <button id="btnEliminarTabla" class="btn btn-dark">
                Eliminar tabla
            </button>

        </div>
    </div>
</body>

</html>
